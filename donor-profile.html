<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aandan Donor Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-amber-50 via-white to-emerald-50 text-gray-900">
    <header class="border-b border-amber-100 bg-white/90 shadow-sm backdrop-blur">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
        <a href="./index.html" class="flex items-center gap-2 font-bold" aria-label="Aandan home"><span>← Home</span></a>
        <a href="./dashboard.html?role=donor&from=login" class="rounded-xl border border-emerald-200 px-4 py-2 text-sm font-semibold text-emerald-700 hover:bg-emerald-50">Dashboard</a>
      </div>
    </header>
    <main class="mx-auto max-w-5xl px-4 py-8 sm:py-12">
      <section class="mb-6 rounded-3xl bg-white/90 p-6 shadow-xl ring-1 ring-amber-100 sm:p-8"><div class="flex flex-col gap-5 sm:flex-row sm:items-center"><img id="profilePhotoPreview" src="photo.png" alt="Your profile" class="h-24 w-24 rounded-full object-cover ring-4 ring-emerald-100" /><div><p class="text-sm font-semibold uppercase tracking-wider text-emerald-700">Donor Profile</p><h1 id="profileName" class="mt-2 text-3xl font-extrabold">Welcome, Donor</h1><p id="profileEmail" class="mt-2 text-gray-600"></p><label class="mt-4 inline-block cursor-pointer rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-2 text-sm font-semibold text-emerald-700">Choose Profile Photo<input id="profilePhotoInput" type="file" accept="image/*" class="hidden" /></label><p id="photoStatus" class="mt-2 text-sm text-emerald-700"></p></div></div></section>
      <section class="grid gap-6 md:grid-cols-2"><article class="rounded-3xl bg-emerald-700 p-6 text-white shadow-xl sm:p-8"><p class="text-sm font-semibold uppercase tracking-wider text-emerald-100">🔥 Your Streak</p><p class="mt-4 text-6xl font-black"><span id="streak">0</span> <span class="text-xl">days</span></p><p id="streakMessage" class="mt-5 font-semibold">Donate to start your streak.</p><p id="longest" class="mt-3 text-sm text-emerald-100">Longest streak: 0 days</p></article><article class="rounded-3xl border border-amber-100 bg-white p-6 shadow-sm sm:p-8"><h2 class="text-2xl font-bold">🎟️ Earned Rewards</h2><p class="mt-2 text-sm text-gray-600">Rewards unlock from your real donation activity.</p><div id="rewards" class="mt-5 space-y-3"></div></article></section>
    </main>
    <script src="./api.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const read = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); } catch (error) { return fallback; } };
        let profile = window.AnnadanAPI?.getProfile() || read("annadanProfile", {});
        let donations = [];
        let donorStats = {};
        try {
          const data = await window.AnnadanAPI.request("/donors/me");
          donorStats = data.donor || {};
          donations = data.donations || [];
          profile = { ...profile, ...donorStats, contact: donorStats.phone, location: donorStats.address, photo: donorStats.profileImage || profile.photo };
          window.AnnadanAPI.setSession(window.AnnadanAPI.getToken(), { ...profile, role: "donor", backendRole: "DONOR" });
        } catch (error) {
          donations = read("annadanDonations", []).filter((item) => item.status !== "rejected");
        }
        const profilePhotoPreview = document.getElementById("profilePhotoPreview");
        const profilePhotoInput = document.getElementById("profilePhotoInput");
        if (profile.photo || profile.profileImage) profilePhotoPreview.src = profile.profileImage || profile.photo;
        profilePhotoInput.addEventListener("change", async () => {
          const file = profilePhotoInput.files[0];
          if (!file) return;
          const formData = new FormData();
          formData.append("photo", file);
          try {
            const result = await window.AnnadanAPI.request("/donors/me", { method: "PUT", body: formData });
            profilePhotoPreview.src = result.donor.profileImage.startsWith("http") ? result.donor.profileImage : `http://localhost:5000${result.donor.profileImage}`;
            document.getElementById("photoStatus").textContent = "Profile photo updated.";
          } catch (error) {
            const reader = new FileReader();
            reader.addEventListener("load", () => {
              profile.photo = reader.result;
              localStorage.setItem("annadanProfile", JSON.stringify(profile));
              profilePhotoPreview.src = profile.photo;
              document.getElementById("photoStatus").textContent = "Profile photo saved locally.";
            });
            reader.readAsDataURL(file);
          }
        });
        document.getElementById("profileName").textContent = profile.name ? `Welcome, ${profile.name}` : "Welcome, Donor"; document.getElementById("profileEmail").textContent = profile.email || "Your donor rewards are shown below.";
        const current = donorStats.currentStreak ?? 0;
        const longest = donorStats.longestStreak ?? 0;
        document.getElementById("streak").textContent = current; document.getElementById("longest").textContent = `Longest streak: ${longest} days`; document.getElementById("streakMessage").textContent = current ? "You're on fire! Keep it going 🔥" : "Donate to start your streak.";
        const human = donations.filter((item) => (item.type || item.intendedType || item.aiClassification || "").toString().toLowerCase().includes("human")).reduce((sum, item) => sum + Number(item.quantityKg || item.quantity || 0), 0); const animal = donations.filter((item) => (item.type || item.intendedType || item.aiClassification || "").toString().toLowerCase().includes("animal")).reduce((sum, item) => sum + Number(item.quantityKg || item.quantity || 0), 0); const rewards = []; if (current >= 50) rewards.push("50 Day Streak Reward · 20% OFF · AANDAN-STREAK-50"); if (human >= 100) rewards.push("Human Donation Reward · 15% OFF · AANDAN-HUMAN-100"); if (animal >= 250) rewards.push("Animal Donation Reward · 20% OFF · AANDAN-ANIMAL-250"); document.getElementById("rewards").innerHTML = rewards.length ? rewards.map((reward) => `<div class="rounded-2xl border border-emerald-100 bg-emerald-50 p-4 font-semibold text-emerald-900">${reward}</div>`).join("") : '<p class="rounded-2xl bg-gray-50 p-4 text-sm text-gray-600">No reward earned yet. Keep donating to unlock rewards!</p>';
        const historyHost = document.createElement("section");
        historyHost.className = "mt-6 rounded-3xl bg-white p-6 shadow-sm ring-1 ring-amber-100";
        historyHost.innerHTML = `<h2 class="text-xl font-bold">Donation activity</h2><p class="mt-1 text-sm text-gray-600">Reward points: ${donorStats.rewardPoints || 0} · Food donated: ${donorStats.totalFoodDonated || 0} kg</p><div class="mt-4 space-y-3">${donations.slice(0, 8).map((d) => `<div class="rounded-2xl bg-emerald-50 p-4"><p class="font-semibold">${d.foodName || "Donation"} · ${d.quantity || d.quantityKg || 0} ${d.unit || "kg"}</p><p class="text-sm text-gray-600">${d.status || ""} · ${d.aiClassification || ""} ${d.destinationName ? "→ " + d.destinationName : ""}</p>${d.donationId ? `<a class="text-sm font-semibold text-emerald-700" href="./tracking.html?donationId=${encodeURIComponent(d.donationId)}">Track</a>` : ""}</div>`).join("") || '<p class="text-sm text-gray-600">No donations yet.</p>'}</div>`;
        document.querySelector("main").appendChild(historyHost);
      });
    </script>
  </body>
</html>
