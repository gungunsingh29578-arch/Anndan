<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Submitted | Annadan</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-emerald-50 via-white to-amber-50 text-slate-900">
    <main class="mx-auto flex min-h-screen max-w-2xl items-center justify-center px-4 py-10">
      <section class="w-full rounded-3xl bg-white p-8 text-center shadow-xl ring-1 ring-emerald-100 sm:p-12">
        <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-full bg-emerald-100 text-4xl text-emerald-700">✓</div>
        <p class="mt-6 text-sm font-bold uppercase tracking-[0.2em] text-emerald-700">Support Request</p>
        <h1 id="successTitle" class="mt-3 text-3xl font-extrabold tracking-tight sm:text-4xl">Your request has been submitted</h1>
        <p class="mx-auto mt-4 max-w-lg text-base leading-7 text-slate-600">Thank you for reaching out. Our support team has received your request and will help you soon.</p>
        <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
          <a id="profileLink" href="./receiver-profile.html" class="rounded-full bg-emerald-600 px-6 py-3 font-semibold text-white shadow-sm transition hover:bg-emerald-700">View Profile</a>
          <a id="dashboardLink" href="./dashboard.html?role=receiver&from=login" class="rounded-full border border-slate-200 px-6 py-3 font-semibold text-slate-700 transition hover:bg-slate-50">Back to Dashboard</a>
        </div>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const type = params.get("type") === "animal" ? "animal" : "human";
      const receiverType = params.get("receiverType") === "shelter" ? "shelter" : "ngo";
      document.getElementById("successTitle").textContent = type === "animal"
        ? "Your animal support request has been submitted"
        : "Your support request has been submitted";
      document.getElementById("profileLink").href = `./receiver-profile.html?receiverType=${receiverType}`;
      document.getElementById("dashboardLink").href = `./dashboard.html?role=receiver&receiverType=${receiverType}&from=login`;
    </script>
  </body>
</html>
