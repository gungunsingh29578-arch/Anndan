<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pickup Options | Annadan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { min-height: 100vh; }
    </style>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-sky-50 via-white to-emerald-50 text-gray-900">
    <main class="mx-auto flex min-h-screen w-full max-w-6xl flex-col px-4 py-10">
      <section class="mb-8 rounded-[2rem] bg-white/95 p-8 shadow-xl ring-1 ring-slate-200">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <a id="backToDashboardLink" href="./dashboard.html?from=login" class="inline-flex items-center gap-2 text-sm font-semibold text-emerald-700 hover:underline">
              <span aria-hidden="true">←</span>
              Back to dashboard
            </a>
            <h1 id="pickupTitle" class="mt-3 text-3xl font-extrabold tracking-tight text-gray-900">Pickup Transport Options</h1>
            <p id="pickupSubtitle" class="mt-2 text-sm text-gray-600">Choose the best pickup vehicle and locate the nearest collection points.</p>
          </div>
          <div class="rounded-3xl bg-emerald-50 px-5 py-4 text-sm font-semibold text-emerald-900">
            <span id="donationSummary">Loading donation details...</span>
          </div>
        </div>
      </section>



      <section class="mb-8 rounded-[2rem] bg-white/95 p-8 shadow-xl ring-1 ring-slate-200">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h2 class="text-xl font-semibold text-gray-900">Confirm pickup</h2>
            <p class="mt-2 text-sm text-gray-600">Select a preferred transport option and continue to track the pickup.</p>
          </div>
          <button id="confirmPickupBtn" type="button" class="inline-flex items-center justify-center rounded-2xl bg-emerald-600 px-5 py-3 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700">Confirm pickup</button>
        </div>
      </section>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const quantity = Number(params.get("quantity") || 0);
        const type = params.get("type") || "human";
        const role = params.get("role") || "donor";
        const donationSummary = document.getElementById("donationSummary");
        const pickupTitle = document.getElementById("pickupTitle");
        const backToDashboardLink = document.getElementById("backToDashboardLink");
        const twoWheelerList = null;
        const chotiVanList = null;
        const confirmBtn = document.getElementById("confirmPickupBtn");
        const optionButtons = [];
        
        let selectedOption = "delivery";

        if (backToDashboardLink) {
          backToDashboardLink.href = `./dashboard.html?from=login&role=${encodeURIComponent(role)}`;
        }

        confirmBtn.addEventListener("click", () => {
          window.location.href = `./dashboard.html?from=login&role=${encodeURIComponent(role)}`;
        });
      });
    </script>
  </body>
</html>
