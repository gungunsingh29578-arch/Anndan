<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receiver Profile | Annadan</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-emerald-50 via-white to-amber-50 text-slate-900">
    <main class="mx-auto min-h-screen max-w-3xl px-4 py-10 sm:py-16">
      <section class="rounded-3xl bg-white p-6 shadow-xl ring-1 ring-emerald-100 sm:p-10">
        <div class="flex flex-col gap-4 border-b border-slate-100 pb-6 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <p id="profileType" class="text-sm font-bold uppercase tracking-[0.2em] text-emerald-700">NGO Profile</p>
            <h1 class="mt-2 text-3xl font-extrabold tracking-tight">Organization Details</h1>
            <p class="mt-2 text-slate-600">The details saved during signup are shown here.</p>
          </div>
          <div class="flex gap-3 text-sm font-semibold">
            <a id="dashboardLink" href="./dashboard.html?role=receiver&from=login" class="rounded-full border border-emerald-200 px-4 py-2 text-emerald-700 hover:bg-emerald-50">Dashboard</a>
          </div>
        </div>
        <div class="mt-8 grid gap-4 sm:grid-cols-2">
          <div class="rounded-2xl bg-emerald-50 p-5"><p class="text-xs font-bold uppercase tracking-wider text-emerald-700">Name</p><p id="profileName" class="mt-2 text-lg font-semibold">Not available</p></div>
          <div class="rounded-2xl bg-amber-50 p-5"><p class="text-xs font-bold uppercase tracking-wider text-amber-700">Email</p><p id="profileEmail" class="mt-2 break-words text-lg font-semibold">Not available</p></div>
          <div class="rounded-2xl bg-slate-50 p-5"><p class="text-xs font-bold uppercase tracking-wider text-slate-600">Contact</p><p id="profileContact" class="mt-2 text-lg font-semibold">Not available</p></div>
          <div class="rounded-2xl bg-slate-50 p-5"><p class="text-xs font-bold uppercase tracking-wider text-slate-600">Sector</p><p id="profileSector" class="mt-2 text-lg font-semibold">Not available</p></div>
          <div class="rounded-2xl bg-sky-50 p-5 sm:col-span-2"><p class="text-xs font-bold uppercase tracking-wider text-sky-700">Location</p><p id="profileLocation" class="mt-2 text-lg font-semibold">Not available</p></div>
        </div>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const receiverType = params.get("receiverType") === "shelter" ? "shelter" : "ngo";
      const profile = JSON.parse(localStorage.getItem("annadanProfile") || "{}");
      document.title = `${receiverType === "shelter" ? "Animal Shelter" : "NGO"} Profile | Annadan`;
      document.getElementById("profileType").textContent = receiverType === "shelter" ? "Animal Shelter Profile" : "NGO Profile";
      document.getElementById("profileName").textContent = profile.name || "Not available";
      document.getElementById("profileEmail").textContent = profile.email || "Not available";
      document.getElementById("profileContact").textContent = profile.contact || "Not available";
      document.getElementById("profileSector").textContent = profile.sector || "Not available";
      document.getElementById("profileLocation").textContent = profile.location || "Not available";
      document.getElementById("dashboardLink").href = `./dashboard.html?role=receiver&receiverType=${receiverType}&from=login`;
    </script>
  </body>
</html>
